<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background squircle container gradient -->
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Top tab: Royal Electric Indigo -->
    <linearGradient id="tabTop" x1="116" y1="240" x2="396" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <!-- Mid tab: Sky Cyan -->
    <linearGradient id="tabMid" x1="144" y1="180" x2="368" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Bottom tab: Rose Violet -->
    <linearGradient id="tabBot" x1="172" y1="120" x2="340" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Outer Squircle Base -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#bg)" stroke="#4F46E5" stroke-width="4" stroke-opacity="0.5" />
  <rect x="52" y="52" width="408" height="408" rx="100" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Bottom Tab 3 (Rose Violet) -->
  <g opacity="0.85" filter="url(#tabShadow)">
    <path d="M172 136C172 127.163 179.163 120 188 120H252C258.365 120 264.12 123.774 266.64 129.62L272 142H324C332.837 142 340 149.163 340 158V206H172V136Z" fill="url(#tabBot)" />
  </g>
  
  <!-- Middle Tab 2 (Sky Cyan) -->
  <g opacity="0.95" filter="url(#tabShadow)">
    <path d="M144 196C144 187.163 151.163 180 160 180H234C240.365 180 246.12 183.774 248.64 189.62L254 202H352C360.837 202 368 209.163 368 218V270H144V196Z" fill="url(#tabMid)" />
  </g>
  
  <!-- Foreground Active Tab 1 (Royal Electric Indigo) -->
  <g filter="url(#tabShadow)">
    <path d="M116 256C116 247.163 123.163 240 132 240H216C222.365 240 228.12 243.774 230.64 249.62L236 262H380C388.837 262 396 269.163 396 278V344C396 352.837 388.837 360 380 360H132C123.163 360 116 352.837 116 344V256Z" fill="url(#tabTop)" stroke="#C7D2FE" stroke-width="2.5" stroke-opacity="0.5" />
    <!-- Gloss lip -->
    <path d="M132 242H216L236 264H380C386 264 394 270 394 278C394 272 386 264 380 264H236L216 242H132C125 242 118 248 118 256C118 250 125 242 132 242Z" fill="white" opacity="0.3" />
    <!-- Tab elements -->
    <rect x="144" y="294" width="76" height="14" rx="7" fill="#312E81" />
    <rect x="232" y="294" width="104" height="14" rx="7" fill="#E0E7FF" opacity="0.85" />
    <circle cx="366" cy="301" r="7" fill="#10B981" />
  </g>
</svg>
