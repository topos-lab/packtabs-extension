<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main P Body: Royal Electric Indigo Gradient -->
    <linearGradient id="pStem" x1="104" y1="76" x2="444" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Tab Slot Capsule: Luminous Cyan Gradient -->
    <linearGradient id="tabSlot" x1="256" y1="108" x2="392" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Ambient Shadow for High-Res Displays -->
    <filter id="pShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- P-3A Transparent Icon Group (No background rectangle, 100% pure transparent alpha) -->
  <g filter="url(#pShadow)">
    <!-- Bold Chamfered P Silhouette -->
    <!-- Stem width = 120px, large counter cutout, smooth rounded corners -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M104 124C104 97.4903 125.49 76 152 76H320C388.483 76 444 131.517 444 200C444 268.483 388.483 324 320 324H224V408C224 423.464 211.464 436 196 436H132C116.536 436 104 423.464 104 408V124ZM224 232H316C333.673 232 348 217.673 348 200C348 182.327 333.673 168 316 168H224V232Z" fill="url(#pStem)" stroke="#C7D2FE" stroke-width="6" stroke-opacity="0.5" />

    <!-- Luminous Tab Header Slot (Symbolizing packed tab card) -->
    <rect x="256" y="108" width="136" height="32" rx="16" fill="url(#tabSlot)" />
    <circle cx="274" cy="124" r="6" fill="#FFFFFF" />
  </g>
</svg>
