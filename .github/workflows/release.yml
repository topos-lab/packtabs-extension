name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v1.2.0；留空则根据 git tag 或 package.json 自动推导)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release 标题 (留空则默认为 "PackTabs {Tag}")'
        required: false
        default: ''
        type: string
      is_draft:
        description: '是否发布为草稿 (Draft Release)'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: '是否发布为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean
      generate_release_notes:
        description: '未找到 CHANGELOG 条目时是否自动生成 GitHub 默认日志'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun run postinstall

      - name: Type Check & Test
        run: |
          bun run compile
          bun run test

      - name: Package extension (Chrome & Firefox zip)
        run: |
          bun run zip
          bun run zip:firefox

      - name: Determine Version and Release Title
        id: meta
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
            TAG="v${PKG_VERSION}"
          fi

          CLEAN_VER="${TAG#v}"

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="PackTabs ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Selected Tag: ${TAG}"
          echo "Clean Version: ${CLEAN_VER}"
          echo "Selected Title: ${TITLE}"

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          CLEAN_VERSION="${TAG#v}"
          bun -e "
            const fs = require('fs');
            const target = process.env.CLEAN_VERSION;
            if (!fs.existsSync('CHANGELOG.md')) {
              process.exit(0);
            }
            const content = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const regex = new RegExp('## \\\\[v?' + target + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)', 'i');
            const match = content.match(regex);
            if (match && match[1].trim()) {
              fs.writeFileSync('RELEASE_BODY.md', match[1].trim());
              console.log('Successfully extracted CHANGELOG for ' + target);
            } else {
              console.log('No specific CHANGELOG entry found for ' + target);
            }
          "
          if [ -s RELEASE_BODY.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLEAN_VERSION: ${{ steps.meta.outputs.version }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'RELEASE_BODY.md' || '' }}
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' && (inputs.generate_release_notes || true) || false }}
          files: |
            .output/*.zip
